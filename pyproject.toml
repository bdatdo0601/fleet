[project]
name = "fleet"
version = "0.1.0"
description = "Self-hosted Nebula fleet: registry + API on the lighthouse, sync on every Mac"
requires-python = ">=3.9"
dependencies = []  # stdlib only, so every Mac can run it with the system/Homebrew python3

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "BLE", "N", "SIM", "RUF"]
ignore = ["S603", "S607", "S101", "UP007", "UP045", "RUF001"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "E501"]
