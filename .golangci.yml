version: "2"

formatters:
  enable:
    - gofumpt

linters:
  default: none
  enable:
    # Correctness
    - govet
    - staticcheck
    - errcheck
    - errorlint
    - bodyclose
    - rowserrcheck
    - sqlclosecheck
    - nilerr
    - contextcheck
    # Anti-slop & complexity
    - unused
    - unparam
    - ineffassign
    - unconvert
    - dupword
    - nolintlint
    - gocritic
    - revive
    - modernize
    - dupl
    - funlen
    - cyclop
  settings:
    cyclop:
      max-complexity: 22
    funlen:
      lines: 120
      statements: 70
    dupl:
      threshold: 100
    govet:
      enable-all: true
      disable:
        - fieldalignment
        - shadow
    revive:
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: empty-block
        - name: error-naming
        - name: error-return
        - name: error-strings
        - name: indent-error-flow
        - name: superfluous-else
        - name: unnecessary-stmt
        - name: unreachable-code
        - name: unused-parameter
        - name: var-naming
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - dupl
          - errcheck
          - funlen
          - cyclop
          - unparam
          - gocritic
